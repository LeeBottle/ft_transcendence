<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Transcendence 유저 등록 테스트</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .form-group { margin-bottom: 10px; }
    label { display: inline-block; width: 80px; }
    input { padding: 5px; width: 200px; }
    button { padding: 6px 12px; cursor: pointer; }
    #result { margin-top: 15px; font-weight: bold; color: green; }
  </style>
</head>
<body>
<h2>유저 등록 테스트</h2>

<form id="userForm">
  <div class="form-group">
    <label for="username">유저명:</label>
    <input type="text" id="username" required placeholder="cadet_test" />
  </div>
  <div class="form-group">
    <label for="email">이메일:</label>
    <input type="email" id="email" required placeholder="test@student.42.fr" />
  </div>
  <button type="submit">DB에 저장하기</button>
</form>

<div id="result"></div>

<script>
  const form = document.getElementById('userForm');
  const resultDiv = document.getElementById('result');

  form.addEventListener('submit', async (e) => {
    e.preventDefault(); // 폼 제출 시 화면 새로고침 방지

    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;

    try {
      // 백엔드 NestJS API 호출
      const response = await fetch('http://localhost:3000/users', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ username, email }),
      });

      if (!response.ok) {
        throw new Error(`서버 에러: ${response.statusText}`);
      }

      const data = await response.json();
      resultDiv.style.color = 'green';
      resultDiv.textContent = `저장 성공! (ID: ${data.id}, 이름: ${data.username})`;

      // 입력창 비우기
      form.reset();
    } catch (err) {
      resultDiv.style.color = 'red';
      resultDiv.textContent = `저장 실패: ${err.message}`;
    }
  });
</script>
</body>
</html>
